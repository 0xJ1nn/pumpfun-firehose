[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pumpfun-firehose"
version = "0.3.0"
description = "Every pump.fun trade, decoded straight from the chain. Zero API keys."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "0xJ1nn" }]
keywords = ["solana", "pump.fun", "pumpfun", "firehose", "market-data", "websocket", "defi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]
dependencies = ["websockets>=12,<16"]

[project.optional-dependencies]
# Terminal UI + JSONL stream.
cli = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
]
# Dashboard, HTTP/WebSocket API, SOL price, metadata, SQLite.
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "aiosqlite>=0.20",
]
all = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "aiosqlite>=0.20",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "aiosqlite>=0.20",
]

[project.scripts]
pumpfire = "pumpfire._entry:main"

[project.urls]
Homepage = "https://github.com/0xJ1nn/pumpfun-firehose"
Issues = "https://github.com/0xJ1nn/pumpfun-firehose/issues"
Source = "https://github.com/0xJ1nn/pumpfun-firehose"

[tool.hatch.build.targets.wheel]
packages = ["src/pumpfire"]

[tool.hatch.build.targets.sdist]
include = ["src/pumpfire", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
